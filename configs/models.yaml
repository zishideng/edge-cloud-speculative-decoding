# models.yaml — model-pair registry for edge-cloud SD.
#
# Each entry defines a draft (edge, llama.cpp GGUF) + target (cloud, vLLM HF)
# pair that share a tokenizer. Select with --model-config <name> in the bench
# scripts, or MODEL_CONFIG=<name> for the shell launchers.
#
# CRITICAL: draft and target MUST share the same tokenizer / vocab_size, or
# speculative decoding produces garbage. The bench scripts validate this at
# startup (see common model_config.validate_vocab). Add a new pair only after
# confirming vocab match (see add_model.md).

llama3:
  description: "bartowski/Meta-Llama-3.1-8B-Instruct-GGUF + bartowski/Llama-3.2-1B-Instruct-GGUF draft (paper default)"
  target: bartowski/Meta-Llama-3.1-8B-Instruct-GGUF
  draft_hf_repo: bartowski/Llama-3.2-1B-Instruct-GGUF
  draft_gguf: Llama-3.2-1B-Instruct-Q4_K_M.gguf
  eos_id: 128009          # <|eot_id|>
  vocab_size: 128256
  max_model_len: 4096

llama3_awq:
  description: "Llama-3.1-8B-Instruct AWQ INT4 target + Llama-3.2-1B-Instruct Q4_K_M draft"
  target: hugging-quants/Meta-Llama-3.1-8B-Instruct-AWQ-INT4
  draft_hf_repo: bartowski/Llama-3.2-1B-Instruct-GGUF
  draft_gguf: Llama-3.2-1B-Instruct-Q4_K_M.gguf
  eos_id: 128009
  vocab_size: 128256
  max_model_len: 4096

qwen25_05b_3b:
  description: "Qwen2.5 0.5B draft + 3B target"
  target: /home/zishideng/models/Qwen2.5-3B-Instruct
  draft_hf_repo: Qwen/Qwen2.5-0.5B-Instruct-GGUF
  draft_gguf: qwen2.5-0.5b-instruct-q4_k_m.gguf
  eos_id: 151645
  vocab_size: 151936
  max_model_len: 4096
  stop_strings:
    - "<|im_end|>"
    - "<|endoftext|>"

qwen25_05b_7b_awq:
  description: "Qwen2.5-7B-Instruct AWQ INT4 target + Qwen2.5-0.5B-Instruct Q4_K_M draft"
  target: Qwen/Qwen2.5-7B-Instruct-AWQ
  draft_hf_repo: Qwen/Qwen2.5-0.5B-Instruct-GGUF
  draft_gguf: qwen2.5-0.5b-instruct-q4_k_m.gguf
  eos_id: 151645
  vocab_size: 151936
  # 7B pads embedding rows to 152064; ids 0..151664 are token-for-token
  # identical to the draft GGUF and the rest are padding on both sides.
  target_vocab_size: 152064
  max_model_len: 4096
  stop_strings:
    - "<|im_end|>"
    - "<|endoftext|>"
